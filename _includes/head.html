<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
{% if page.description %}<meta name="description" content="{{ page.description | strip_html | truncate: 200 | escape }}">{% else %}<meta name="description" content="{{ site.description | escape }}">{% endif %}
<link rel="icon" href="{{ '/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
{% if page.url == "/" %}<link rel="preload" href="{{ '/registry/mechs-summary.json' | relative_url }}" as="fetch" crossorigin>{% endif %}
